name: Build Delivery App APK and AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 1. Google Services JSON restore (agar secret present ho)
      - name: Restore google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
          fi

      # 2. Supabase Environment Variables Injection (.env, local.properties & gradle.properties)
      - name: Inject Supabase Environment Variables
        run: |
          cat << 'EOF' > .env
          VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF

          mkdir -p app
          cp .env app/ || true

          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
          echo "supabaseUrl=${{ secrets.SUPABASE_URL }}" >> gradle.properties
          echo "supabaseKey=${{ secrets.SUPABASE_ANON_KEY }}" >> gradle.properties

      # 3. Production Keystore Setup (Root aur App dono folders me placed)
      - name: Create Production Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias deliveryKey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass DeliveryPass123 \
            -keypass DeliveryPass123 \
            -dname "CN=SndmartDelivery, OU=Logistics, O=Sndmart, L=Sindhanur, S=Karnataka, C=IN"
          cp release.keystore app/release.keystore

      # 4. Build Signed APK (--no-daemon, lint aur tests bypass)
      - name: Build APK
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          gradle assembleRelease \
            --no-daemon \
            -x lint \
            -x lintVitalRelease \
            -x test \
            -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
            -Pandroid.injected.signing.store.password=DeliveryPass123 \
            -Pandroid.injected.signing.key.alias=deliveryKey \
            -Pandroid.injected.signing.key.password=DeliveryPass123

      # 5. Build Signed App Bundle (AAB)
      - name: Build App Bundle (AAB)
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          gradle bundleRelease \
            --no-daemon \
            -x lint \
            -x lintVitalRelease \
            -x test \
            -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
            -Pandroid.injected.signing.store.password=DeliveryPass123 \
            -Pandroid.injected.signing.key.alias=deliveryKey \
            -Pandroid.injected.signing.key.password=DeliveryPass123

      # 6. Upload APK Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: delivery-release-apk
          path: app/build/outputs/apk/release/*.apk

      # 7. Upload AAB Artifact
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: delivery-release-aab
          path: app/build/outputs/bundle/release/*.aab

      # 8. Backup Keystore File
      - name: Backup Keystore File
        uses: actions/upload-artifact@v4
        with:
          name: delivery-production-keystore
          path: release.keystore
