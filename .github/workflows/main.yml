name: Build SND Mart Partner APK and AAB

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (empty = value in app/build.gradle.kts). Must be higher than the last Play upload."
        required: false
      version_name:
        description: "versionName (empty = repository variable VERSION_NAME, else app/build.gradle.kts)"
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compiles the whole app (no secrets needed: .env.example and a missing
      # google-services.json are tolerated for debug builds).
      # lintVitalRelease is the lint gate the signed release build runs.
      - name: Debug build, release lint and unit tests
        run: ./gradlew assembleDebug lintVitalRelease testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/

  build:
    needs: test
    # Signed release builds on pushes to main, or on demand ("Run workflow") for any branch.
    # Pull requests never get the signing secrets.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      # Play Store needs a strictly increasing versionCode; VERSION_NAME is what the
      # force-update check compares against app_versions.minimum_supported_version.
      # Empty values fall back to the defaults in app/build.gradle.kts.
      VERSION_CODE: ${{ inputs.version_code || vars.VERSION_CODE || '' }}
      VERSION_NAME: ${{ inputs.version_name || vars.VERSION_NAME || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check required secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          missing=0
          for name in GOOGLE_SERVICES_JSON KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name"; missing=1; fi
          done
          exit $missing

      - name: Restore Google Services JSON
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

      - name: Create environment file
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY"
          } > .env

      - name: Build Release APK and AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sndmart-partner-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: sndmart-partner-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f my-upload-key.jks
          rm -f app/google-services.json
          rm -f .env
